<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>CLIP<span>FORGE</span></h1><p class="sub">Turn long videos into vertical clips.</p><form id="form"><label>YouTube link</label><input name="url" placeholder="Paste a YouTube URL here"><label>Or upload a video</label><input type="file" name="video" accept="video/*"><label>What kind of moments should I find?</label><textarea name="prompt" placeholder="Funny moments, useful tips, highlights..." rows="3"></textarea><button id="go">GENERATE CLIPS</button></form><p id="status"></p><section id="results"></section><small>First run downloads the speech recognition model and can take a while.</small></main><script src="/static/app.js"></script></body></html>
